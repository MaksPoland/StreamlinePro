<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=https://keonv.com/yhES">
    <title>Cardione - További információk</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .redirect-container {
            max-width: 600px;
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
        }
        .product-logo {
            max-width: 150px;
            margin-bottom: 1.5rem;
        }
        .loading-spinner {
            margin: 2rem 0;
        }
        .progress {
            height: 10px;
            margin: 1.5rem 0;
        }
        .countdown {
            font-size: 3rem;
            font-weight: bold;
            color: #0d6efd;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <img src="../images/cardiobalance.svg" alt="Cardione (CardioBalance)" class="product-logo">
        <h1 class="h4 mb-3">Átirányítás a Cardione hivatalos oldalára</h1>
        <p>Köszönjük érdeklődését termékünk iránt! Átirányítjuk a hivatalos weboldalra, ahol további információkat találhat és megrendelheti a terméket.</p>
        
        <div class="countdown" id="countdown">3</div>
        
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%" id="progress-bar"></div>
        </div>
        
        <p class="mb-4">Ha nem történik automatikus átirányítás, kattintson az alábbi gombra:</p>
        <a href="https://keonv.com/yhES" class="btn btn-primary btn-lg" target="_blank" rel="nofollow">
            Tovább a hivatalos oldalra <i class="fas fa-external-link-alt ms-2"></i>
        </a>
    </div>

    <!-- JavaScript for countdown and progress bar -->
    <script>
        // Countdown and progress bar
        let seconds = 3;
        const countdownElement = document.getElementById('countdown');
        const progressBar = document.getElementById('progress-bar');
        
        function updateCountdown() {
            seconds--;
            countdownElement.textContent = seconds;
            
            // Update progress bar
            const progressPercent = (1 - seconds / 3) * 100;
            progressBar.style.width = progressPercent + '%';
            
            if (seconds <= 0) {
                clearInterval(timer);
            }
        }
        
        const timer = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
