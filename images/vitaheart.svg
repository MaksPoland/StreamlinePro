<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <circle cx="200" cy="150" r="80" fill="#f8f8f8" stroke="#ddd" stroke-width="2"/>
  <text x="200" y="20" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#0056b3" font-weight="bold">VitaHeart</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Q10-koenzimes formula</text>
  
  <!-- Heart shape -->
  <path d="M200,120 c-25,-30 -75,-30 -75,20 c0,30 50,60 75,80 c25,-20 75,-50 75,-80 c0,-50 -50,-50 -75,-20 z" fill="#f99" stroke="#e74c3c" stroke-width="2"/>
  
  <!-- Q10 molecule representation -->
  <circle cx="170" cy="150" r="8" fill="#3498db"/>
  <circle cx="190" cy="130" r="8" fill="#3498db"/>
  <circle cx="210" cy="150" r="8" fill="#3498db"/>
  <circle cx="230" cy="130" r="8" fill="#3498db"/>
  <line x1="170" y1="150" x2="190" y2="130" stroke="#2980b9" stroke-width="2"/>
  <line x1="190" y1="130" x2="210" y2="150" stroke="#2980b9" stroke-width="2"/>
  <line x1="210" y1="150" x2="230" y2="130" stroke="#2980b9" stroke-width="2"/>
  
  <!-- Shine effect -->
  <circle cx="170" cy="150" r="3" fill="#fff"/>
  <circle cx="190" cy="130" r="3" fill="#fff"/>
  <circle cx="210" cy="150" r="3" fill="#fff"/>
  <circle cx="230" cy="130" r="3" fill="#fff"/>
