<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <text x="200" y="20" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#0056b3" font-weight="bold">Herzena</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Prémium szív- és érrendszeri formula</text>
  
  <!-- Heart monitor background -->
  <rect x="100" y="100" width="200" height="100" rx="10" ry="10" fill="#f8f8f8" stroke="#ddd" stroke-width="2"/>
  
  <!-- Heart ECG line -->
  <polyline points="100,150 120,150 130,150 140,120 150,180 160,140 170,150 300,150" stroke="#e74c3c" stroke-width="3" fill="none"/>
  
  <!-- Heart shaped capsule -->
  <g transform="translate(200, 150) rotate(-20)">
    <path d="M0,0 C-10,-15 -30,-15 -30,0 C-30,15 -10,30 0,15 C10,30 30,15 30,0 C30,-15 10,-15 0,0" fill="#f8d7da" stroke="#e74c3c" stroke-width="2"/>
    <path d="M-10,0 C-15,-5 -20,-5 -20,0 C-20,5 -15,10 -10,5 C-5,10 0,5 0,0 C0,-5 -5,-5 -10,0" fill="#e74c3c"/>
    <path d="M10,0 C5,-5 0,-5 0,0 C0,5 5,10 10,5 C15,10 20,5 20,0 C20,-5 15,-5 10,0" fill="#e74c3c"/>
  </g>
  
  <!-- Heart icon -->
  <path d="M200,60 c-5,-10 -15,-10 -15,0 c0,5 10,15 15,20 c5,-5 15,-15 15,-20 c0,-10 -10,-10 -15,0 z" fill="#e74c3c"/>
</svg>