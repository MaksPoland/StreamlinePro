<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <text x="200" y="20" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#0056b3" font-weight="bold">CardioBalance</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Gazdaságos szív- és érrendszeri formula</text>
  
  <!-- Balance scale -->
  <line x1="200" y1="90" x2="200" y2="160" stroke="#34495e" stroke-width="6"/>
  <line x1="140" y1="130" x2="260" y2="130" stroke="#34495e" stroke-width="4"/>
  
  <!-- Scale plates -->
  <g transform="translate(155, 170)">
    <path d="M0,0 C0,-20 30,-20 30,0 Z" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="15" cy="-5" r="12" fill="#f1c40f"/>
    <text x="15" y="0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">❤️</text>
  </g>
  
  <g transform="translate(215, 170)">
    <path d="M0,0 C0,-20 30,-20 30,0 Z" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="15" cy="-5" r="12" fill="#f1c40f"/>
    <text x="15" y="0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">❤️</text>
  </g>
  
  <!-- Balance base -->
  <rect x="170" y="210" width="60" height="10" rx="2" ry="2" fill="#34495e"/>
  <rect x="185" y="160" width="30" height="50" fill="#34495e"/>
  
  <!-- Heart symbol -->
  <g transform="translate(170, 70) scale(0.6)">
    <path d="M200,120 c-25,-30 -75,-30 -75,20 c0,30 50,60 75,80 c25,-20 75,-50 75,-80 c0,-50 -50,-50 -75,-20 z" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  </g>
</svg>